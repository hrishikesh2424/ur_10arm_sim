controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ur10_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

# UR10 Joint Trajectory Controller Configuration
ur10_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      
# Gripper Controller Configuration for Robotiq 3F
gripper_controller:
  ros__parameters:
    # The 3F gripper has multiple joints, but we typically control the base joint
    # For simplified control, we can use just one of the actuator joints
    joint: finger_1_joint_1  # Main actuator joint
    
    action_monitor_rate: 20.0
    
    # Gripper command interface
    command_interface: position
    
    # State interfaces
    state_interfaces:
      - position
      - velocity
    
    # Gripper-specific parameters
    max_effort: 100.0
    max_velocity: 0.5
    
    # Goal tolerance
    goal_tolerance: 0.01
    max_position_error: 0.02
    max_velocity_error: 0.1

# Joint State Broadcaster
joint_state_broadcaster:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      # Robotiq 3F Gripper joints
      - finger_1_joint_1
      - finger_1_joint_2
      - finger_1_joint_3
      - finger_2_joint_1
      - finger_2_joint_2
      - finger_2_joint_3
      - finger_middle_joint_1
      - finger_middle_joint_2
      - finger_middle_joint_3
      - palm_finger_1_joint
      - palm_finger_2_joint
    
    interfaces:
      - position
      - velocity