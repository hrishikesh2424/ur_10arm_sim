controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # UR10 Arm Controller
    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Robotiq 3F Gripper Controller
    robotiq_3f_gripper_controller:
      type: position_controllers/GripperActionController

# UR10 Configuration
scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

# Robotiq 3F Gripper Configuration
robotiq_3f_gripper_controller:
  ros__parameters:
    joint: palm_finger_1_joint
    action_monitor_rate: 20.0
    state_publish_rate: 25.0
    goal_tolerance: 0.01
    max_effort: 100.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.01

# Joint State Broadcaster
joint_state_broadcaster:
  ros__parameters:
    joints:
      # UR10 joints
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      # Robotiq 3F gripper joints
      - palm_finger_1_joint
      - finger_1_joint_1
      - finger_1_joint_2
      - finger_1_joint_3
      - palm_finger_2_joint
      - finger_2_joint_1
      - finger_2_joint_2
      - finger_2_joint_3
      - finger_middle_joint_1
      - finger_middle_joint_2
      - finger_middle_joint_3
    interfaces:
      - position
      - velocity